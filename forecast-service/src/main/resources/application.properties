spring.application.name=forecast-service
server.port=${PORT:8082}

# Where the inventory microservice lives (REST inter-service call)
medichain.inventory.base-url=${INVENTORY_URL:http://localhost:8081}
medichain.default-district=Vellore
medichain.state-name=Tamil Nadu

spring.datasource.url=jdbc:h2:mem:forecastdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.error.include-message=always
