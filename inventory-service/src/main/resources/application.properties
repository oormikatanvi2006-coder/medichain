spring.application.name=inventory-service
server.port=${PORT:8081}

# In-memory H2: reseeded on every start so the demo story is always the same.
# For a persistent DB use jdbc:h2:file:./data/inventorydb or a PostgreSQL URL.
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.error.include-message=always

# Simulated dispensing feed: issues stock every few seconds so the dashboard moves.
# speed 1 = real-time consumption rate, 12 = twelve times faster. Set enabled=false to switch it off.
medichain.live-feed.enabled=true
medichain.live-feed.speed=12
medichain.live-feed.interval-ms=5000
